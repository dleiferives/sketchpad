[package]
name = "sketchpad"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "0.3"
env_logger = "0.10"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["xinput"] }
